name: Build and deploy ASP.Net Core app to Azure Web App - urbaniq-backend-jesus2024

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # 1. Restaurar dependencias de la API e Infraestructura
      - name: Restore dependencies
        run: |
          dotnet restore Backend/Ecommerce.Api/Ecommerce.Api.csproj
          dotnet restore Backend/Ecommerce.Infrastructure/Ecommerce.Infrastructure.csproj

      # 2. Instalación de la herramienta CLI de EF Core
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef

      # 3. Aplicar migraciones directamente en Azure SQL
      - name: Apply EF Core Migrations
        run: |
          dotnet ef database update \
            --project Backend/Ecommerce.Infrastructure/Ecommerce.Infrastructure.csproj \
            --startup-project Backend/Ecommerce.Api/Ecommerce.Api.csproj \
            --connection "${{ secrets.AZURE_SQL_CONNECTION_STRING }}"

      # 4. Compilar la API
      - name: Build with dotnet
        run: dotnet build Backend/Ecommerce.Api/Ecommerce.Api.csproj --configuration Release --no-restore

      # 5. Publicar binarios
      - name: dotnet publish
        run: dotnet publish Backend/Ecommerce.Api/Ecommerce.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      # 6. Subir artefacto
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'urbaniq-backend-jesus2024'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_A165F665F160431CA3586AC6849E0894 }}
