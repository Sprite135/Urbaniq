name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore Ecommerce.sln

    - name: Build Backend
      run: dotnet build Ecommerce.sln --configuration Release --no-restore

    - name: Run Backend Tests
      env:
        ASPNETCORE_ENVIRONMENT: Testing
      run: dotnet test Ecommerce.sln --configuration Release --no-build --verbosity normal

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install Frontend Dependencies
      run: |
        cd Frontend
        npm ci

    - name: Build Frontend
      run: |
        cd Frontend
        npm run build

    - name: Run Frontend Tests
      run: |
        cd Frontend
        npm test -- --run --maxWorkers=1

    - name: Lint Frontend
      run: |
        cd Frontend
        npm run lint

    - name: Publish Backend
      run: dotnet publish Backend/Ecommerce.Api/Ecommerce.Api.csproj --configuration Release --no-build --output artifacts/backend

    - name: Verify Frontend Is Bundled
      shell: bash
      run: |
        test -f artifacts/backend/wwwroot/index.html
        entry=$(grep -oE '/assets/index-[^" ]+\.js' artifacts/backend/wwwroot/index.html | head -1)
        test -n "$entry"
        test -f "artifacts/backend/wwwroot${entry}"

    - name: Upload Frontend Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: frontend-build
        path: Frontend/dist

    - name: Upload Backend Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: backend-build
        path: artifacts/backend

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./Backend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/urbaniq-backend:latest
          ${{ secrets.DOCKER_USERNAME }}/urbaniq-backend:${{ github.sha }}

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./Frontend
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/urbaniq-frontend:latest
          ${{ secrets.DOCKER_USERNAME }}/urbaniq-frontend:${{ github.sha }}

  deploy-backend:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download Backend Build Artifacts
      uses: actions/download-artifact@v4
      with:
        name: backend-build
        path: backend-build

    - name: Zip Backend Build
      run: |
        cd backend-build
        zip -r ../backend.zip .

    - name: Deploy to Azure App Service
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'urbaniq-backend-jesus2024'
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: backend.zip
