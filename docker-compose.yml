version: '3.8'

services:
  # SQL Server Database
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: urbaniq-db
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Urbaniq@2024!Secure
      - MSSQL_PID=Express
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql
    networks:
      - urbaniq-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: urbaniq-redis
    ports:
      - "6379:6379"
    networks:
      - urbaniq-network

  # Backend API
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: urbaniq-backend
    ports:
      - "44320:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=UrbaniqDb;User Id=sa;Password=Urbaniq@2024!Secure;TrustServerCertificate=True;MultipleActiveResultSets=true
      - Redis__ConnectionString=redis:6379
      - JwtSettings__SecretKey=UrbaniqSuperSecretKeyForDevelopmentOnly123456789
      - JwtSettings__Issuer=https://localhost:44320
      - JwtSettings__Audience=https://localhost:44320
      - JwtSettings__ExpirationInMinutes=60
    depends_on:
      - db
      - redis
    networks:
      - urbaniq-network

  # Frontend
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: urbaniq-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - urbaniq-network

networks:
  urbaniq-network:
    driver: bridge

volumes:
  sqldata:
